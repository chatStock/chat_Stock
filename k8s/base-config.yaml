apiVersion: v1
kind: ConfigMap
metadata:
  name: chat-stock-config
data:
  MCP_TRANSPORT: "stdio"
  MCP_HOST: "0.0.0.0"
  MCP_PORT: "8000"
  MARKET_API_URL: "http://market-api-service:9000"
---
apiVersion: v1
kind: Secret
metadata:
  name: chat-stock-secrets
type: Opaque
stringData:
  # Replace these placeholder values from CI/CD variables at deploy time.
  GF_SECURITY_ADMIN_PASSWORD: "__SET_IN_CICD__"
  HF_TOKEN: "__SET_IN_CICD__"
  FINNHUB_API_KEY: "__SET_IN_CICD__"
